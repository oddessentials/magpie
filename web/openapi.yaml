            - type: 'null'
        buildings:
          anyOf:
            - $ref: '#/components/schemas/SavedBuildings'
            - type: 'null'
        saved_at:
          type: string
          format: date-time
        day:
          type:
            - integer
            - 'null'
          minimum: 0
        time_of_day:
          type:
            - number
            - 'null'
          minimum: 0

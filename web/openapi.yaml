      properties:
        logs_poll_s:
          type: [number, 'null']
          minimum: 1
        saves_poll_s:
          type: [number, 'null']
          minimum: 10
        logs_checked_at:
          type: [string, 'null']
          format: date-time
        saves_checked_at:
          type: [string, 'null']
          format: date-time
      required: [logs_poll_s, saves_poll_s, logs_checked_at, saves_checked_at]
      additionalProperties: false
    CollectorLayers:
      type: object
      description: Which data sources this collector run reads.
      properties:
        remote:
          anyOf:
            - $ref: '#/components/schemas/RemoteObservation'
            - type: 'null'
        logs:
          type: boolean
        logs_source:
          type:
            - string
            - 'null'
          enum:
            - launch
            - file
            - stdin
            - docker
            - remote
            - null
          description: launch when the collector starts the server itself, file for a local log, remote for polled FTP/FTPS/SFTP files, stdin and docker for piped and container logs.
        saves:
          type: boolean
          description: Whether the collector reads the world save.
        process:
          type: boolean
          description: Whether the collector measures the server process (launch mode only).
        mod:
          type: boolean
          description: Whether the collector reads the events file of the server mod.
      required:
        - logs
        - logs_source
        - saves
        - process
        - mod
      additionalProperties: true
    ServerSettings:
      type: object
      description: What the collector read from the server's configuration files. A value it could not read is null.
      properties:
        max_players:
          type:
            - integer
            - 'null'
          minimum: 0
          description: MaxPlayers from DedicatedServerGame.ini, 6 on build 25465077.
        platform_policy:
          type:
            - string
            - 'null'
          description: PlatformPolicy from DedicatedServer.ini, for example Crossplay.
        save_frequency_min:
          type:
            - integer
            - 'null'
          minimum: 0
          description: dom.StateSaveFrequencyMins, 5 by default.
      additionalProperties: true
    CollectorStartedData:
      type: object
      properties:
        collector_version:
          type: string
        os:
          type: string
        arch:
          type: string
        layers:
          $ref: '#/components/schemas/CollectorLayers'
        server:
          anyOf:
            - $ref: '#/components/schemas/ServerInfo'
            - type: 'null'
        settings:
          anyOf:
            - $ref: '#/components/schemas/ServerSettings'
            - type: 'null'
      required:
        - collector_version
        - os
        - arch
        - layers
        - server
        - settings
      additionalProperties: true
    CollectorHeartbeatData:
      type: object
      properties:
        remote:
          anyOf:
            - $ref: '#/components/schemas/RemoteObservation'
            - type: 'null'
        uptime_s:
          type: number
          minimum: 0
        queue_depth:
          type: integer
          minimum: 0
        dropped_events:
          type: integer
          minimum: 0
        logs:
          type: string
          enum:
            - ok
            - off
            - idle
            - error
        saves:
          type: string
          description: ok after a successful read, waiting until the first one, off when no save reader is set up, error when the last read failed.
          enum:
            - ok
            - waiting
            - off
            - error
        process:
          type: string
          description: ok while the collector measures the process, off outside launch mode, unavailable when the measurement failed.
          enum:
            - ok
            - off
            - unavailable
        mod:
          type: string
          description: ok while the collector reads the mod's events file, waiting until the file appears, off when no mod is set up.
          enum:
            - ok
            - waiting
            - off
      required:
        - uptime_s
        - queue_depth
        - dropped_events
        - logs
        - saves
        - process
        - mod
      additionalProperties: true
    ServerOnlineData:
      allOf:
        - $ref: '#/components/schemas/ServerInfo'
        - type: object
          properties:
            settings:
              description: The settings at this start, so a change made while the server was down reaches the site.
              anyOf:
                - $ref: '#/components/schemas/ServerSettings'
                - type: 'null'
    ServerStoppingData:
      type: object
      description: The server announced a stop and saves the world before it exits, for example when the collector asked the server mod for a graceful stop. save failed means the world save did not complete; the server mod keeps the server running, and the site no longer shows it as stopping.
      properties:
        by:
          type:
            - string
            - 'null'
          description: Who asked, for example collector or admin.
        save:
          type:
            - string
            - 'null'
          enum:
            - requested
            - done
            - failed
            - null
      required:
        - by
        - save
      additionalProperties: true
    ServerOfflineData:
      type: object
      properties:
        reason:
          type: string
          description: stopped when the process exited normally, crashed when it exited with an error, unreachable when the collector lost it, collector_stopping when the collector itself shut down.
          enum:
            - stopped
            - crashed
            - unreachable
            - collector_stopping
      required:
        - reason
      additionalProperties: true
    ServerSavedData:
      type: object

        - time_of_day
        - weather
        - events
        - hardcore
        - friendly_fire
        - difficulty
        - size_bytes
      additionalProperties: false
    WorldTotals:
      type: object
      properties:
        players:
          type: integer
          minimum: 0
        sessions:
          type: integer
          minimum: 0
        playtime_s:
          type: number
          minimum: 0
        deaths:
          type: integer
          minimum: 0
        level_ups:
          type: integer
          minimum: 0
        journal_entries:
          type: integer
          minimum: 0
        quests_completed:
          type: integer
          minimum: 0
      required:

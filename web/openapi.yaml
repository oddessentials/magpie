                items:
                  type: string
              skills:
                type: array
                description: The character's skill levels and experience by skill asset.
                items:
                  type: object
                  additionalProperties: false
                  required: [skill, level, xp]
                  properties:
                    skill:
                      type: string
                    level:
                      type: integer
                      minimum: 1
                    xp:
                      type: number
                      minimum: 0
        stock:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [item, name, category, count, at_least, holders]
            properties:
              item:
                type: string
              name:
                type: [string, 'null']
              category:
                type: [string, 'null']
                description: The item's category tag from items.json.
              count:
                type: integer
                minimum: 0
              at_least:
                type: boolean
              holders:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [player, count, at_least]
                  properties:
                    player:
                      $ref: '#/components/schemas/PlayerRef'
                    count:
                      type: integer
                      minimum: 0
                    at_least:
                      type: boolean
        base:
          anyOf:
            - type: object
              additionalProperties: false
              required: [saved_at, pieces, unfinished, requirements]
              properties:
                saved_at:
                  type: string
                  format: date-time
                pieces:
                  type: integer
                  minimum: 0
                unfinished:
                  type: integer
                  minimum: 0
                requirements:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [item, name, missing]
                    properties:
                      item:
                        type: string
                        description: The item's asset, or its save id when the game facts do not list it.
                      name:
                        type: [string, 'null']
                      missing:
                        type: integer
                        minimum: 1
            - type: 'null'
    Journal:
      type: object
      additionalProperties: false
      required: [saved_at, unlocks, entries, players]
      properties:
        saved_at:
          type: [string, 'null']
          format: date-time
        unlocks:
          type: array
          description: The unlock conditions the entries' recipe_unlock values point to.
          items:
            $ref: '#/components/schemas/CatalogUnlock'
        entries:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              [
                id,
                asset,
                name,
                category,
                group,
                unlock,
                item,
                recipe,
                creature,
                regions,
                found_by,
                first_found,
                item_name,
                recipe_unlock,
                find
              ]
            properties:
              id:
                type: [string, 'null']
              asset:
                type: string
              name:
                type: [string, 'null']
              category:
                type: [string, 'null']
              group:
                type: [string, 'null']
              unlock:
                type: [string, 'null']
                description: How the game unlocks the entry, for example AIKill, ItemFirstPickup or RecipeUnlocked.
              item:
                type: [string, 'null']
              recipe:
                type: [string, 'null']
              creature:
                type: [string, 'null']
                description: The name of the creature whose kill unlocks the entry.
              item_name:
                type: [string, 'null']
                description: The name of the item the entry is about.
              recipe_unlock:
                type: [integer, 'null']
                minimum: 0
                description: How the game unlocks the recipe that teaches the entry, as an index into unlocks.
              find:
                type: [string, 'null']
                description: Where the map layers place the entry, as the map page's find value, a kind (item, creature or lore) and an asset joined by a colon. Null when no layer places it.
              regions:
                type: array
                description: The areas the entry's locations name, such as Ghornfell.
                items:
                  type: string
              found_by:
                type: array
                description: Ids of the players whose saved characters have the entry.
                items:
                  type: integer
              first_found:
                anyOf:
                  - type: object
                    additionalProperties: false
                    required: [player, at]
                    properties:
                      player:
                        type: integer
                      at:
                        type: string
                        format: date-time
                  - type: 'null'
        players:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [player, found]
            properties:
              player:
                $ref: '#/components/schemas/PlayerRef'
              found:
                type: integer
                minimum: 0
    Progression:
      type: object
      additionalProperties: false
      required: [totals, bosses, players]
      properties:
        totals:
          type: object
          additionalProperties: false
          required: [skills, quests, main_quests, journal, recipes, buildings, bosses, areas]
          properties:
            skills:
              type: integer
            quests:
              type: integer
            main_quests:
              type: integer
            journal:
              type: integer
            recipes:
              type: integer
            buildings:
              type: integer
            bosses:
              type: integer
            areas:
              type: array
              description: The quests the game places in each area; area is null for quests without one.
              items:
                type: object
                additionalProperties: false
                required: [area, quests]
                properties:
                  area:
                    type: [string, 'null']
                  quests:
                    type: integer
        bosses:
          type: array
          description: The names of the game's bosses.
          items:
            type: string
        players:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              [
                player,
                saved_at,
                total_level,
                skills,
                quests,
                journal,
                recipes,
                buildings,
                creatures,
                bosses,
                latest
              ]
            properties:
              player:
                $ref: '#/components/schemas/PlayerRef'
              saved_at:
                type: string
                format: date-time
              total_level:
                type: [integer, 'null']
              skills:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [id, name, level]
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    level:
                      type: [integer, 'null']
              quests:
                type: object
                additionalProperties: false
                required: [completed, active, main_completed, areas]
                properties:
                  completed:
                    type: integer
                  active:
                    type: integer
                  main_completed:
                    type: integer
                  areas:
                    type: array
                    description: Completed quests per area, counting the quests totals.areas counts.
                    items:
                      type: object
                      additionalProperties: false
                      required: [area, completed]
                      properties:
                        area:
                          type: [string, 'null']
                        completed:
                          type: integer
              journal:
                type: integer
              recipes:
                type: integer
              buildings:
                type: integer
              creatures:
                type: integer
              bosses:
                type: array
                description: Names of the bosses the character has killed.
                items:
                  type: string
              latest:
                anyOf:
                  - type: object
                    additionalProperties: false
                    required: [kind, name, at]
                    properties:
                      kind:
                        type: string
                        enum: [recipe, building, journal]
                      name:
                        type: [string, 'null']
                      at:
                        type: string
                        format: date-time
                  - type: 'null'
    World:
      type: object
      properties:
        name:
          type:
            - string
            - 'null'
        world_name:
          type:
            - string
            - 'null'
        version:

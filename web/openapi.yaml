openapi: 3.1.0
info:
  title: Magpie API
  version: 1.0.0
  summary: Public read API, admin API, live stream and collector ingest of a Magpie site.
  description: 'Conventions: JSON UTF-8; timestamps ISO 8601 UTC with Z; world positions x, y and z in Unreal units (centimetres) as the server logs them; durations in seconds unless the field name ends in _ms. Errors: the HTTP status plus { error: { code, message } }. Public responses never contain IP addresses, account or platform ids, passwords or join codes; players appear by character name and platform only. The collector posts signed batches to /api/ingest; every event carries an id, a per-run sequence number, the collector run id, a UTC timestamp, a type and a data object. The site validates the data of the event types documented here, stores events of unknown types without processing them, ignores unknown fields, and flags an event whose data does not match its schema instead of rejecting its batch, so collectors and sites of different versions keep working together. Every fact about the game in this document was read from Steam build 25465077 of the dedicated server.'
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:5173
    description: Local development server (npm run dev, npm run dev:mock).
  - url: http://localhost:3000
    description: Local production image.
security: []
tags:
  - name: public
    description: What anyone can read about the server and its players.
  - name: stream
    description: Live updates as server-sent events.
  - name: admin
    description: Settings, collector connection, players, events, backups and jobs. Needs the admin session cookie; changes also need a same-origin Origin header.
  - name: system
    description: Health, site information and this contract.
  - name: ingest
    description: Signed batches from the collector.
paths:
  /api/v1/status:
    get:
      operationId: getStatus
      tags:
        - public
      summary: Server status
      description: Online, offline or unknown (the site has lost contact with its collector), who is on, the server process, the last world save and what the collector can see. Each figure names when it was observed so a page can say where it comes from and how old it is.
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/status/history:
    get:
      operationId: getStatusHistory
      tags:
        - public
      summary: Status history
      description: Server state, player counts and process memory in time buckets (5 minutes for 24h, 1 hour for 7d, 6 hours for 30d), oldest first.
      parameters:
        - name: range
          in: query
          required: false
          description: How far back.
          schema:
            type: string
            enum:
              - 24h
              - 7d
              - 30d
            default: 24h
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusHistory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/online:
    get:
      operationId: getOnline
      tags:
        - public
      summary: Players online
      description: The players in the world now as the server log reports them, longest online first.
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnlineList'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/activity:
    get:
      operationId: listActivity
      tags:
        - public
      summary: Activity feed
      description: What happened on the server, newest first. Chat items need the chat feature.
      parameters:
        - name: types
          in: query
          required: false
          description: Comma-separated activity types to include.
          schema:
            type: string
        - $ref: '#/components/parameters/PlayerFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/players:
    get:
      operationId: listPlayers
      tags:
        - public
      summary: Players
      description: Every player the site has seen, except hidden ones.
      parameters:
        - name: sort
          in: query
          required: false
          description: Order of the list. playtime, deaths and last_seen sort highest first, name alphabetically.
          schema:
            type: string
            enum:
              - last_seen
              - playtime
              - deaths
              - name
            default: last_seen
        - name: q
          in: query
          required: false
          description: Only players whose name contains this text, ignoring case.
          schema:
            type: string
            maxLength: 64
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/players/{id}:
    get:
      operationId: getPlayer
      tags:
        - public
      summary: Player
      description: A player with their totals, current session, recent sessions and deaths, what the world save records about their character, and what the server mod has seen them do. A hidden player answers 404.
      parameters:
        - $ref: '#/components/parameters/PlayerId'
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Player'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/players/{id}/sessions:
    get:
      operationId: listPlayerSessions
      tags:
        - public
      summary: A player's sessions
      description: Newest first.
      parameters:
        - $ref: '#/components/parameters/PlayerId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/chat:
    get:
      operationId: listChat
      tags:
        - public
      summary: Chat
      description: Chat messages newest first, as the server mod reported them. Needs the chat feature, which is off until the admin switches it on.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/world:
    get:
      operationId: getWorld
      tags:
        - public
      summary: World
      description: The server, the last world save (day count, weather per region, world events) and totals since the site began keeping the log.
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/World'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/map:
    get:
      operationId: getWorldMap
      tags:
        - public
      summary: World map
      description: Static region polygons and fixed landmarks from the stamped game build. Coordinates are game X and Y; these are not live positions or saved discoveries.
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorldMap'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/map/layers/{layer}:
    get:
      operationId: getMapLayer
      tags:
        - public
      summary: Map layer
      description: Placed world objects of one kind from the stamped game build, grouped by type, with game X and Y. Static facts, not live positions.
      parameters:
        - name: layer
          in: path
          required: true
          description: The layer.
          schema:
            $ref: '#/components/schemas/MapLayerName'
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapLayer'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/map/live:
    get:
      operationId: getMapLive
      tags:
        - public
      summary: Players, bases and deaths on the map
      description: Each character's last saved position, the bases the last world save records and the deaths of the last 24 hours. Needs the positions feature, which is off until the admin switches it on.
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapLive'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/catalog:
    get:
      operationId: getCatalog
      tags:
        - public
      summary: Catalog
      description: Items, recipes, building pieces, crafting stations and skills from the stamped game build, for planning. Static facts.
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/ledger:
    get:
      operationId: getLedger
      tags:
        - public
      summary: Ledger
      description: What the saved characters carry and have unlocked, and what the unfinished pieces of the last world save still need. From the world save, never live.
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ledger'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/journal:
    get:
      operationId: getJournal
      tags:
        - public
      summary: Journal
      description: Every journal entry from the stamped game build, which saved characters have found it, and when it was first seen.
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Journal'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/progression:
    get:
      operationId: getProgression
      tags:
        - public
      summary: Progression
      description: Each saved character's skills, quests, journal, unlocks and defeated bosses, from the world save.
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Progression'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/stream:
    get:
      operationId: streamEvents
      tags:
        - stream
      summary: Live stream
      description: "Server-sent events. Event names: status (the Status object, on connect and whenever it changes), online (the OnlineList, on connect and on change) and activity (one ActivityItem per new feed item, with the frame id set to the event id). When a later event changes a feed item that was already sent, for example the server mod's death detail merging into a death seen in the log, the item is sent again with the same ActivityItem id and no frame id; clients replace the item they hold with that id. A comment frame every 15 s keeps the connection alive. A reconnect with Last-Event-ID first replays up to 100 newer activity items."
      parameters:
        - $ref: '#/components/parameters/LastEventId'
        - name: last_event_id
          in: query
          required: false
          description: Same as the Last-Event-ID header, for clients that reconnect manually.
          schema:
            type: string
      responses:
        '200':
          description: An event stream that stays open.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/StreamFrame'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/health:
    get:
      operationId: getHealth
      tags:
        - system
      summary: Health
      description: Container health check.
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/site:
    get:
      operationId: getSite
      tags:
        - system
      summary: Site information
      description: The site name, the project version and the features the admin has switched on.
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/openapi.json:
    get:
      operationId: getOpenApi
      tags:
        - system
      summary: This contract
      description: The OpenAPI document the site serves and validates against, as JSON.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
  /api/v1/admin/login:
    post:
      operationId: adminLogin
      tags:
        - admin
      summary: Log in
      description: Sets an HttpOnly, SameSite=Lax (Secure on https) session cookie. Limited to 5 attempts per minute per address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '204':
          description: Logged in; the cookie is set.
          headers:
            Set-Cookie:
              description: The admin session cookie.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/logout:
    post:
      operationId: adminLogout
      tags:
        - admin
      summary: Log out
      description: Ends the admin session and clears the cookie.
      security:
        - adminCookie: []
      responses:
        '204':
          description: Logged out; the cookie is cleared.
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/session:
    get:
      operationId: getAdminSession
      tags:
        - admin
      summary: Session state
      description: Whether the cookie holds a valid admin session.
      responses:
        '200':
          description: Whether the cookie holds a valid session, and whether the first password still has to be set.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSession'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/setup:
    post:
      operationId: adminSetup
      tags:
        - admin
      summary: Set the first admin password
      description: Stores the admin password as a scrypt hash and logs in. Only while no password is stored and ADMIN_PASSWORD is not set. Limited to 5 attempts per minute per address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
      responses:
        '204':
          description: Password stored and logged in; the cookie is set.
          headers:
            Set-Cookie:
              description: The admin session cookie.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/settings:
    get:
      operationId: getAdminSettings
      tags:
        - admin
      summary: Site settings
      description: The site name, the feature switches and the retention periods, with the settings fixed by environment variables.
      security:
        - adminCookie: []
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
    put:
      operationId: updateAdminSettings
      tags:
        - admin
      summary: Change site settings
      description: Changes the given settings and keeps the others. A setting whose environment variable is set cannot be changed here.
      security:
        - adminCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSettingsUpdate'
      responses:
        '200':
          description: The settings after the change.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/collector:
    get:
      operationId: getAdminCollector
      tags:
        - admin
      summary: Collector connection
      description: The secret the collector signs with, the recent collector runs and the ingest counters of the last 24 hours.
      security:
        - adminCookie: []
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorAdmin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/collector/secret:
    post:
      operationId: regenerateCollectorSecret
      tags:
        - admin
      summary: Replace the collector secret
      description: The running collector is rejected until it is given the new secret.
      security:
        - adminCookie: []
      responses:
        '200':
          description: The new secret.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorSecret'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/players:
    get:
      operationId: listAdminPlayers
      tags:
        - admin
      summary: Players with their account ids
      description: Every player with the account id and character guid that public responses leave out.
      parameters:
        - name: q
          in: query
          required: false
          description: Only players whose name, account id or character guid contains this text, ignoring case.
          schema:
            type: string
            maxLength: 128
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      security:
        - adminCookie: []
      responses:
        '200':
          description: Most recently seen first, hidden players included.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPlayerPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/players/{id}:
    patch:
      operationId: updateAdminPlayer
      tags:
        - admin
      summary: Rename or hide a player
      description: Sets or removes a name override and hides or shows the player.
      parameters:
        - $ref: '#/components/parameters/PlayerId'
      security:
        - adminCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerPatch'
      responses:
        '200':
          description: The player after the change.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPlayer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/events:
    get:
      operationId: listAdminEvents
      tags:
        - admin
      summary: Raw events
      description: Stored events newest first, with their data exactly as received.
      parameters:
        - name: type
          in: query
          required: false
          description: Only this event type.
          schema:
            type: string
            maxLength: 64
        - name: invalid
          in: query
          required: false
          description: Only events flagged as invalid.
          schema:
            type: boolean
        - $ref: '#/components/parameters/PlayerFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      security:
        - adminCookie: []
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/projections/rebuild:
    post:
      operationId: rebuildProjections
      tags:
        - admin
      summary: Rebuild sessions and history
      description: Replays every stored event in time order to rebuild sessions, deaths, journal entries, level-ups, chat, the saves and the player totals. Ingest answers 503 while it runs.
      security:
        - adminCookie: []
      responses:
        '202':
          description: Queued.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/backups:
    get:
      operationId: listBackups
      tags:
        - admin
      summary: Backups
      description: Database backups on the backup volume, newest first.
      security:
        - adminCookie: []
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/backups/run:
    post:
      operationId: runBackup
      tags:
        - admin
      summary: Back up now
      description: Dumps the database to the backup volume and keeps the 14 newest backups.
      security:
        - adminCookie: []
      responses:
        '202':
          description: Queued.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/jobs/{id}:
    get:
      operationId: getJob
      tags:
        - admin
      summary: Job state
      description: Progress of a rebuild or backup job.
      parameters:
        - $ref: '#/components/parameters/JobId'
      security:
        - adminCookie: []
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/health:
    get:
      operationId: getAdminHealth
      tags:
        - admin
      summary: Site health
      description: The collector connection, ingest counters, database size, backups and background jobs.
      security:
        - adminCookie: []
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminHealth'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/ingest:
    post:
      operationId: ingestBatch
      tags:
        - ingest
      summary: Collector batch
      description: Verifies the timestamp window (5 minutes) and the HMAC with a constant-time comparison, stores every event it has not seen (duplicates by event id are counted and skipped), applies the documented event types to the site's views in the same transaction, and answers with counts. The actions list is empty in this version and reserved for admin actions the collector will carry out.
      security:
        - collectorSignature: []
      parameters:
        - $ref: '#/components/parameters/MagpieTimestamp'
        - $ref: '#/components/parameters/MagpieSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestBatch'
      responses:
        '200':
          description: Counts for the batch.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResult'
        '401':
          description: 'unauthorized: bad signature or stale timestamp.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: 'payload_too_large: body over 512 KB.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'unprocessable: the body is not JSON or the batch envelope is malformed. Events with bad data never cause this; they are flagged.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 'unavailable: the database cannot be reached; the collector retries.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  headers:
    CacheControl:
      description: public, max-age=15 on public GET responses, and public, max-age=3600 on the game facts that only change with the site's build (catalog, map and map layers).
      schema:
        type: string
    ETag:
      description: Entity tag of the response body.
      schema:
        type: string
    NoStore:
      description: no-store on stream, admin and ingest responses.
      schema:
        type: string
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous next_cursor.
      schema:
        type: string
    PlayerFilter:
      name: player
      in: query
      required: false
      description: Only items involving this player id.
      schema:
        type: integer
        minimum: 1
    PlayerId:
      name: id
      in: path
      required: true
      description: Player id.
      schema:
        type: integer
        minimum: 1
    JobId:
      name: id
      in: path
      required: true
      description: Job id.
      schema:
        type: integer
        minimum: 1
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: Sent by EventSource on reconnect; newer activity items are replayed first (at most 100).
      schema:
        type: string
    MagpieTimestamp:
      name: X-Magpie-Timestamp
      in: header
      required: true
      description: Signature timestamp.
      schema:
        type: integer
        description: Unix seconds; must be within 5 minutes of the site clock.
    MagpieSignature:
      name: X-Magpie-Signature
      in: header
      required: true
      description: HMAC-SHA256 of timestamp + "." + body with the collector secret.
      schema:
        type: string
        pattern: ^sha256=[0-9a-f]{64}$
  responses:
    RateLimited:
      description: 'rate_limited: more than 120 requests per minute from this address.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: 'bad_request: a parameter or body field is invalid.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 'unauthorized: no valid admin session, or a wrong password.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 'forbidden: the Origin header does not match the site.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 'not_found: no such resource, or its feature is switched off.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 'conflict: the request clashes with the current state, for example a setting fixed by an environment variable or a job that is already running.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: 'unavailable: the database cannot be reached.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    adminCookie:
      type: apiKey
      in: cookie
      name: admin_session
      description: The session cookie set by /api/v1/admin/login or /api/v1/admin/setup.
    collectorSignature:
      type: apiKey
      in: header
      name: X-Magpie-Signature
      description: sha256=<hex HMAC-SHA256> over X-Magpie-Timestamp + "." + body with the collector secret (COLLECTOR_SECRET, or the one on the admin Collector page).
  schemas:
    Error:
      type: object
      description: Error envelope returned with every non-2xx status.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - bad_request
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - payload_too_large
                - unprocessable
                - rate_limited
                - unavailable
                - not_implemented
            message:
              type: string
          required:
            - code
            - message
          additionalProperties: false
      required:
        - error
      additionalProperties: false
    Health:
      type: object
      properties:
        ok:
          type: boolean
        db:
          type: boolean
        mock:
          type: boolean
        version:
          type: string
      required:
        - ok
        - db
        - mock
        - version
      additionalProperties: false
    SiteFeatures:
      type: object
      description: Switches the admin controls. A switched-off feature leaves the menu, its API routes answer 404, and its data leaves the feed and the stream.
      properties:
        chat:
          type: boolean
          description: Chat in the feed, on the chat page and in the stream. Off by default, because chat reaches the site through a server mod that players may not expect.
        positions:
          type: boolean
          description: Players' last saved positions, bases and deaths on the map. Off by default, because they show where players and their bases are.
      required:
        - chat
        - positions
      additionalProperties: false
    Site:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
          description: The project version, shared by the site and the collector.
        features:
          $ref: '#/components/schemas/SiteFeatures'
      required:
        - name
        - version
        - features
      additionalProperties: false
    PlayerRef:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required:
        - id
        - name
      additionalProperties: false
    Platform:
      type: string
      description: The platform the login line names, in lower case. Build 25465077 reports pc; other values are shown as they arrive.
      minLength: 1
      maxLength: 32
    StatusState:
      type: string
      description: unknown when the site has lost contact with its collector or has never heard from one.
      enum:
        - online
        - offline
        - unknown
    CollectorLayersSummary:
      type: object
      description: What the collector reads, and so what this site can show.
      properties:
        logs:
          type: boolean
        saves:
          type: boolean
        process:
          type: boolean
        mod:
          type: boolean
      required:
        - logs
        - saves
        - process
        - mod
      additionalProperties: false
    StatusServer:
      type: object
      properties:
        name:
          type:
            - string
            - 'null'
        version:
          type:
            - string
            - 'null'
          description: The game version the collector read, for example 1.0.0.5.
        world_name:
          type:
            - string
            - 'null'
      required:
        - name
        - version
        - world_name
      additionalProperties: false
    StatusPlayers:
      type: object
      description: From the server log.
      properties:
        online:
          type: integer
          minimum: 0
        max:
          type:
            - integer
            - 'null'
          minimum: 0
        observed_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the log last reported a join or a leave.
      required:
        - online
        - max
        - observed_at
      additionalProperties: false
    StatusProcess:
      type: object
      description: From the server process, when the collector launched it.
      properties:
        memory_mb:
          type:
            - number
            - 'null'
        uptime_s:
          type:
            - number
            - 'null'
        cpu_percent:
          type:
            - number
            - 'null'
        measured_at:
          type:
            - string
            - 'null'
          format: date-time
      required:
        - memory_mb
        - uptime_s
        - cpu_percent
        - measured_at
      additionalProperties: false
    StatusSave:
      type: object
      description: From the last world save the collector read.
      properties:
        saved_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the server last saved the world, from its log or from the save file, whichever is newer.
        day:
          type:
            - integer
            - 'null'
          minimum: 0
          description: The in-game day of the newest save the collector read, counted from 0 as the game counts it.
        clock:
          anyOf:
            - $ref: '#/components/schemas/StatusClock'
            - type: 'null'
      required:
        - saved_at
        - day
        - clock
      additionalProperties: false
    StatusClock:
      type: object
      description: The in-game clock recorded by the newest world save the collector read. One real second is one in-game minute. The clock runs whenever the world is loaded, with or without players, and resumes from the saved value when the server starts again.
      properties:
        seconds:
          type: number
          minimum: 0
          description: The saved clock, StoredTime, in real seconds since the world began.
        observed_at:
          type: string
          format: date-time
          description: When that save was written.
        rate:
          type: number
          minimum: 0.9
          maximum: 1
          description: In-game seconds per real second between the two newest saves while the server stayed up, or 1 until there are two. The clock stops while the server stalls, so it runs a little slower than real time.
        stale_after_s:
          type: integer
          minimum: 600
          maximum: 3600
          description: How long the clock can go without a newer save while the server is up before it counts as out of date. Twice the longest gap between the newest saves, from 600 to 3600 seconds.
      required:
        - seconds
        - observed_at
        - rate
        - stale_after_s
      additionalProperties: false
    StatusCollector:
      type: object
      properties:
        remote:
          anyOf:
            - $ref: '#/components/schemas/RemoteObservation'
            - type: 'null'
        state:
          type: string
          description: active while batches arrive, stopped after a clean stop, lost when batches stopped for 3 minutes, none before the first batch.
          enum:
            - active
            - stopped
            - lost
            - none
        version:
          type:
            - string
            - 'null'
        last_seen_at:
          type:
            - string
            - 'null'
          format: date-time
        layers:
          anyOf:
            - $ref: '#/components/schemas/CollectorLayersSummary'
            - type: 'null'
      required:
        - state
        - version
        - last_seen_at
        - layers
      additionalProperties: false
    Status:
      type: object
      properties:
        state:
          $ref: '#/components/schemas/StatusState'
        since:
          type:
            - string
            - 'null'
          format: date-time
          description: When the current state began.
        server:
          $ref: '#/components/schemas/StatusServer'
        players:
          $ref: '#/components/schemas/StatusPlayers'
        process:
          $ref: '#/components/schemas/StatusProcess'
        save:
          $ref: '#/components/schemas/StatusSave'
        collector:
          $ref: '#/components/schemas/StatusCollector'
        stopping:
          type: boolean
          description: True after the server announced a stop (it saves the world first) until it goes offline or comes back.
        updated_at:
          type: string
          format: date-time
      required:
        - state
        - since
        - server
        - players
        - process
        - save
        - collector
        - stopping
        - updated_at
      additionalProperties: false
    StatusHistoryPoint:
      type: object
      properties:
        ts:
          type: string
          format: date-time
          description: Start of the bucket.
        state:
          $ref: '#/components/schemas/StatusState'
        players_max:
          type: integer
          minimum: 0
        players_avg:
          type: number
          minimum: 0
        memory_mb_avg:
          type:
            - number
            - 'null'
      required:
        - ts
        - state
        - players_max
        - players_avg
        - memory_mb_avg
      additionalProperties: false
    StatusHistory:
      type: object
      properties:
        range:
          type: string
          enum:
            - 24h
            - 7d
            - 30d
        bucket_s:
          type: integer
        points:
          type: array
          items:
            $ref: '#/components/schemas/StatusHistoryPoint'
      required:
        - range
        - bucket_s
        - points
      additionalProperties: false
    OnlinePlayer:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        platform:
          $ref: '#/components/schemas/Platform'
        joined_at:
          type: string
          format: date-time
        down:
          type: boolean
          description: True after a death until the log shows the respawn.
      required:
        - id
        - name
        - platform
        - joined_at
        - down
      additionalProperties: false
    OnlineList:
      type: object
      properties:
        players:
          type: array
          items:
            $ref: '#/components/schemas/OnlinePlayer'
        observed_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the log last reported a join or a leave.
        updated_at:
          type: string
          format: date-time
      required:
        - players
        - observed_at
        - updated_at
      additionalProperties: false
    ActivityType:
      type: string
      enum:
        - server.online
        - server.stopping
        - server.offline
        - collector.lost
        - player.joined
        - player.left
        - player.died
        - journal.unlocked
        - skill.level_up
        - quest.updated
        - chat.message
        - player.kicked
        - world.dusk_approaching
        - world.dawn_approaching
    ChatChannel:
      type: string
      description: global when the message went to everyone, direct when the sender named receivers, other otherwise.
      enum:
        - global
        - direct
        - other
    ActivityDetails:
      type: object
      description: 'Type-specific details. player.left: session_s. player.died: cause, killer. journal.unlocked: entry, entry_name. skill.level_up: skill, skill_name, level. quest.updated: quest, quest_name, state, objective. chat.message: channel, text. player.kicked: by, reason. server.online: version. server.stopping: by, save. server.offline: reason. collector.lost: last_seen_at.'
      properties:
        session_s:
          type:
            - number
            - 'null'
        cause:
          type:
            - string
            - 'null'
        killer:
          type:
            - string
            - 'null'
        entry:
          type: string
          description: The journal entry id, for example JOURNAL_World_Fauna_Chicken.
        entry_name:
          type:
            - string
            - 'null'
          description: The entry's name from the game facts (journal.json), or null for an entry they do not list.
        skill:
          type: string
        skill_name:
          type:
            - string
            - 'null'
        level:
          type: integer
        quest:
          type: string
        quest_name:
          type:
            - string
            - 'null'
        state:
          type: string
        objective:
          type:
            - string
            - 'null'
        channel:
          $ref: '#/components/schemas/ChatChannel'
        text:
          type: string
        by:
          type:
            - string
            - 'null'
        save:
          type:
            - string
            - 'null'
          description: server.stopping only. requested, done, or failed when the world save did not complete and the server keeps running.
        version:
          type:
            - string
            - 'null'
        reason:
          type:
            - string
            - 'null'
        last_seen_at:
          type: string
          format: date-time
        turn_at:
          type: string
          format: date-time
          description: When nightfall or dawn follows a warning, projected from the saved clock.
        turn_in_s:
          type: integer
          minimum: 0
          description: Real seconds from the warning to nightfall or dawn.
      additionalProperties: false
    ActivityItem:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        type:
          $ref: '#/components/schemas/ActivityType'
        ts:
          type: string
          format: date-time
        player:
          anyOf:
            - $ref: '#/components/schemas/PlayerRef'
            - type: 'null'
        details:
          $ref: '#/components/schemas/ActivityDetails'
      required:
        - id
        - type
        - ts
        - player
        - details
      additionalProperties: false
    ActivityPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ActivityItem'
        next_cursor:
          type:
            - string
            - 'null'
      required:
        - items
        - next_cursor
      additionalProperties: false
    PlayerSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        platform:
          $ref: '#/components/schemas/Platform'
        online:
          type: boolean
        first_seen:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time
        playtime_s:
          type: number
          minimum: 0
          description: Includes the current session.
        sessions:
          type: integer
          minimum: 0
        deaths:
          type: integer
          minimum: 0
      required:
        - id
        - name
        - platform
        - online
        - first_seen
        - last_seen
        - playtime_s
        - sessions
        - deaths
      additionalProperties: false
    PlayerPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlayerSummary'
        next_cursor:
          type:
            - string
            - 'null'
      required:
        - items
        - next_cursor
      additionalProperties: false
    SessionEndReason:
      type: string
      description: left when the player left, server_offline when the server stopped, collector_stopped or collector_lost when the site stopped hearing from the collector.
      enum:
        - left
        - server_offline
        - collector_stopped
        - collector_lost
    Session:
      type: object
      properties:
        id:
          type: integer
        joined_at:
          type: string
          format: date-time
        left_at:
          type:
            - string
            - 'null'
          format: date-time
        duration_s:
          type:
            - number
            - 'null'
          minimum: 0
          description: Null while the session is open.
        end_reason:
          anyOf:
            - $ref: '#/components/schemas/SessionEndReason'
            - type: 'null'
        deaths:
          type: integer
          minimum: 0
      required:
        - id
        - joined_at
        - left_at
        - duration_s
        - end_reason
        - deaths
      additionalProperties: false
    SessionPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Session'
        next_cursor:
          type:
            - string
            - 'null'
      required:
        - items
        - next_cursor
      additionalProperties: false
    Death:
      type: object
      properties:
        at:
          type: string
          format: date-time
        cause:
          type:
            - string
            - 'null'
        killer:
          type:
            - string
            - 'null'
        source:
          type: string
          description: log when the server log showed it, mod when the server mod reported it with its cause.
          enum:
            - log
            - mod
      required:
        - at
        - cause
        - killer
        - source
      additionalProperties: false
    CurrentSession:
      type: object
      properties:
        id:
          type: integer
        joined_at:
          type: string
          format: date-time
      required:
        - id
        - joined_at
      additionalProperties: false
    PlayerSkill:
      type: object
      description: One of the character's skills as the world save records it. The twelve skills of the game facts (skills.json) come first in the game's order, with the level read off the experience curve (xp.json, level 2 at 33 experience, level 99 at 1,000,000); a skill the save names that the facts do not know follows with a null name and level.
      properties:
        id:
          type: string
          description: The skill's persistence id, as the save and skills.json key it.
        name:
          type:
            - string
            - 'null'
        xp:
          type: number
          minimum: 0
        level:
          type:
            - integer
            - 'null'
          minimum: 1
        level_xp:
          type:
            - number
            - 'null'
          minimum: 0
          description: The experience at which the current level begins.
        next_level_xp:
          type:
            - number
            - 'null'
          minimum: 0
          description: The experience at which the next level begins, null at the maximum level.
      required:
        - id
        - name
        - xp
        - level
        - level_xp
        - next_level_xp
      additionalProperties: false
    PlayerHealth:
      type: object
      properties:
        current:
          type: number
        max:
          type: number
      required:
        - current
        - max
      additionalProperties: false
    PlayerQuests:
      type: object
      properties:
        active:
          type: integer
          minimum: 0
        completed:
          type: integer
          minimum: 0
      required:
        - active
        - completed
      additionalProperties: false
    PlayerJournal:
      type: object
      properties:
        unlocked:
          type: integer
          minimum: 0
        unread:
          type: integer
          minimum: 0
      required:
        - unlocked
        - unread
      additionalProperties: false
    PlayerCharacter:
      type: object
      description: What the world save records about the character, never live.
      properties:
        saved_at:
          type: string
          format: date-time
          description: When the server wrote the save these come from.
        playtime_s:
          type:
            - number
            - 'null'
          minimum: 0
          description: The playtime the game itself counts for this world.
        health:
          anyOf:
            - $ref: '#/components/schemas/PlayerHealth'
            - type: 'null'
        skills:
          type: array
          items:
            $ref: '#/components/schemas/PlayerSkill'
        total_level:
          type:
            - integer
            - 'null'
          minimum: 0
          description: The sum of the known skill levels.
        quests:
          $ref: '#/components/schemas/PlayerQuests'
        journal:
          $ref: '#/components/schemas/PlayerJournal'
        spells:
          type:
            - integer
            - 'null'
          minimum: 0
        regions_revealed:
          type:
            - integer
            - 'null'
          minimum: 0
        inventory:
          description: The inventory slots of the last save, null when the collector did not send them.
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/PlayerSlot'
        loadout:
          description: The equipped items of the last save, null when the collector did not send them.
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/PlayerSlot'
        unlocks:
          anyOf:
            - $ref: '#/components/schemas/PlayerUnlocks'
            - type: 'null'
        level_history:
          type: array
          description: The total level at each saved change over the last 30 days, oldest first.
          items:
            type: object
            additionalProperties: false
            required: [saved_at, total_level]
            properties:
              saved_at:
                type: string
                format: date-time
              total_level:
                type: integer
                minimum: 0
        xp_gains:
          type: array
          description: Experience each skill gained in the last day and the last week, from the character's saved samples. A window reaching past the first sample counts from that sample.
          items:
            type: object
            additionalProperties: false
            required: [id, name, day, week]
            properties:
              id:
                type: string
              name:
                type: string
              day:
                type: number
                minimum: 0
              week:
                type: number
                minimum: 0
      required:
        - saved_at
        - playtime_s
        - health
        - skills
        - total_level
        - quests
        - journal
        - spells
        - regions_revealed
        - inventory
        - loadout
        - unlocks
        - level_history
        - xp_gains
      additionalProperties: false
    PlayerSlot:
      type: object
      additionalProperties: false
      required: [slot, item, name, category, count, at_least, durability]
      properties:
        slot:
          type: integer
          minimum: 0
        item:
          type: [string, 'null']
          description: The item's asset from items.json, null for an id the game facts do not list.
        name:
          type: [string, 'null']
        category:
          type: [string, 'null']
          description: The item's category tag from items.json.
        count:
          type: integer
          minimum: 0
        at_least:
          type: boolean
          description: True when the save stores no count for the slot, which then holds at least the count shown.
        durability:
          type: [number, 'null']
    PlayerUnlocks:
      type: object
      additionalProperties: false

      properties:
        region:
          type: string
          description: The region key in the save, for example base, dowdun or sands.
        type:
          type: string
          description: The weather type name as the save records it, for example Cloudy or Sunny.
        day_count:
          type:
            - integer
            - 'null'
        remaining_s:
          type:
            - number
            - 'null'

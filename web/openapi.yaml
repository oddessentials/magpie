            - 'null'
      required:
        - user_id
        - character_guid
        - name
      additionalProperties: true
    EventPlayer:
      type: object
      description: Who an event of a type this contract does not document is about, by character name and platform only; documented types carry the identity in their data.
      properties:
        name:
          type: string
        platform:
          type:
            - string
            - 'null'
      required:
        - name
      additionalProperties: true
    EventEnvelope:
      type: object
      description: The fields every event carries. The site stores every event whatever its type and projects only the types it knows, so a collector or mod that emits a new kind never breaks ingest.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        seq:
          type: integer
          minimum: 0
          description: Monotonic per collector run.
        run_id:
          $ref: '#/components/schemas/Uuid'
        ts:
          type: string
          format: date-time
          description: When the collector observed the event, or when the server logged it, in UTC.
        type:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
        v:
          type: integer
          minimum: 1
          description: The version of the data shape, from collectors that send one.
        player:
          anyOf:
            - $ref: '#/components/schemas/EventPlayer'
            - type: 'null'
        data:
          type: object
      required:
        - id
        - seq
        - run_id
        - ts
        - type
        - data
      additionalProperties: true

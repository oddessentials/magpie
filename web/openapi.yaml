        level_ups:
          type: integer
          minimum: 0
          description: Skill level-ups the server mod reported.
        quests_completed:
          type: integer
          minimum: 0
        buildings:
          type: integer
          minimum: 0
        crafts:
          type: integer
          minimum: 0
      required:
        - journal_entries
        - level_ups
        - quests_completed
        - buildings
        - crafts
      additionalProperties: false
    Player:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        platform:
          $ref: '#/components/schemas/Platform'
        online:
          type: boolean
        first_seen:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time
        playtime_s:
          type: number
          minimum: 0
        sessions:
          type: integer
          minimum: 0
        deaths:
          type: integer
          minimum: 0
        current_session:
          anyOf:
            - $ref: '#/components/schemas/CurrentSession'
            - type: 'null'
        chat_messages:
          type:
            - integer
            - 'null'
          description: Null unless the chat feature is on.
        recent_sessions:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/Session'
        recent_deaths:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/Death'
        character:
          description: The character as the world save records it; null until the collector's save reader has read it.
          anyOf:
            - $ref: '#/components/schemas/PlayerCharacter'
            - type: 'null'
        feats:
          description: What the site has seen the player do; null until it has seen something.
          anyOf:
            - $ref: '#/components/schemas/PlayerFeats'
            - type: 'null'
      required:
        - id
        - name
        - platform
        - online
        - first_seen
        - last_seen
        - playtime_s
        - sessions
        - deaths
        - current_session
        - chat_messages
        - recent_sessions
        - recent_deaths
        - character
        - feats
      additionalProperties: false
    ChatItem:
      type: object
      properties:

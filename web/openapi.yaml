          items:
            type: object
            additionalProperties: false
            required: [class, name]
            properties:
              class:
                type: string
              name:
                type: string
        skill:
          description: The skill to level, for skill_level.
          anyOf:
            - type: object
              additionalProperties: false
              required: [asset, name]
              properties:
                asset:

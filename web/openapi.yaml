        - $ref: '#/components/schemas/CollectorHeartbeatEvent'
        - $ref: '#/components/schemas/ServerOnlineEvent'
        - $ref: '#/components/schemas/ServerStoppingEvent'
        - $ref: '#/components/schemas/ServerOfflineEvent'
        - $ref: '#/components/schemas/ServerSavedEvent'
        - $ref: '#/components/schemas/ServerMetricsEvent'
        - $ref: '#/components/schemas/PlayerJoinedEvent'
        - $ref: '#/components/schemas/PlayerLeftEvent'
        - $ref: '#/components/schemas/PlayerDiedEvent'
        - $ref: '#/components/schemas/PlayerRespawnedEvent'
        - $ref: '#/components/schemas/JournalUnlockedEvent'
        - $ref: '#/components/schemas/SaveWorldEvent'
        - $ref: '#/components/schemas/SavePlayerEvent'
        - $ref: '#/components/schemas/SaveProgressEvent'
        - $ref: '#/components/schemas/SaveReadEvent'
        - $ref: '#/components/schemas/LogOtherEvent'
        - $ref: '#/components/schemas/ChatMessageEvent'
        - $ref: '#/components/schemas/PlayerEventEvent'
        - $ref: '#/components/schemas/PlayerXpEvent'
        - $ref: '#/components/schemas/SkillLevelUpEvent'
        - $ref: '#/components/schemas/QuestUpdatedEvent'
        - $ref: '#/components/schemas/BuildingPlacedEvent'
        - $ref: '#/components/schemas/ItemCraftedEvent'
        - $ref: '#/components/schemas/AdminActionEvent'
        - $ref: '#/components/schemas/PlayerKickedEvent'
        - $ref: '#/components/schemas/OtherEvent'
    IngestBatch:
      type: object
      description: Signed batch posted by the collector. At most 500 events and 512 KB per request.
      properties:
        collector:
          $ref: '#/components/schemas/CollectorInfo'
        server:
          anyOf:
            - $ref: '#/components/schemas/ServerInfo'
            - type: 'null'
        events:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/CollectorEvent'
      required:

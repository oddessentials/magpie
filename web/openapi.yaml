    Uuid:
      type: string
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    UserId:
      type: string
      minLength: 1
      maxLength: 128
      description: The account id from the login line (the EOS product user id, 32 hex characters on build 25465077, the same id the entered-world line shows as Account[XP:...]). Treated as an opaque key. Never shown publicly.
    CharacterGuid:
      type:
        - string
        - 'null'
      pattern: ^[0-9A-F]{32}$
      description: The character guid the entered-world line shows as Guid[DCG:...] and the world save keys its cached character state by. Never shown publicly.
    CollectorInfo:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        run_id:
          $ref: '#/components/schemas/Uuid'
        os:
          type: string
        arch:
          type: string
      required:
        - name
        - version
        - run_id
      additionalProperties: true
    ServerInfo:
      type: object
      description: What the collector knows about the server from its configuration, its log header and the world save.
      properties:
        name:
          type: string
          description: ServerName from DedicatedServer.ini.
        version:
          type:
            - string
            - 'null'
          description: The game version, for example 1.0.0.5.
        build:
          type:
            - string
            - 'null'
          description: The engine build string the log header prints, for example ++dominion+hotfix-CL-244954.
        world_name:
          type: string
          description: DefaultWorldName from DedicatedServer.ini, the save slot name.
        world_guid:
          type:
            - string
            - 'null'
          description: The world save guid, from the save header or the session's WorldSaveGuid attribute.
        max_players:
          type:
            - integer
            - 'null'
          minimum: 0
      required:
        - name
        - world_name
      additionalProperties: true
    CollectorEvent:

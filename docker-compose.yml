name: magpie-dev

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: magpie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-magpie}
      POSTGRES_DB: magpie
    ports:
      - '5434:5432'
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U magpie -d magpie']
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    profiles: [site]
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      DATABASE_URL: postgres://magpie:${POSTGRES_PASSWORD:-magpie}@db:5432/magpie
      COLLECTOR_SECRET: ${COLLECTOR_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
      PUBLIC_SITE_NAME: ${PUBLIC_SITE_NAME}
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      PORT: '3000'
      API_MOCK: ${API_MOCK:-0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '3000:3000'
    volumes:
      - ./local/backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Georgia, 'Times New Roman', serif">
  <rect width="1200" height="760" fill="#101522"/>
  <text x="48" y="64" fill="#eef1f6" font-size="34">Magpie palette and type</text>
  <text x="48" y="94" fill="#aab3c5" font-size="16">Night blue surfaces, silver ink, an iridescent teal accent, heather and dusk gold from the wilds.</text>
